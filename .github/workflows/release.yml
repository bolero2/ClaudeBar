name: Release

# Build ClaudeDeck.app and attach it to a GitHub Release when a v* tag is pushed.
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - name: Show toolchain
        run: swift --version

      - name: Build ClaudeDeck.app
        run: ./scripts/make-app.sh
        env:
          CLAUDEDECK_VERSION: ${{ github.ref_name }}   # tag drives the bundle version

      - name: Zip bundle
        run: ditto -c -k --keepParent ClaudeDeck.app ClaudeDeck.zip

      - name: Create / update release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0 (node24)
        with:
          files: ClaudeDeck.zip
          generate_release_notes: true
          body: |
            Prebuilt **ClaudeDeck.app** — download `ClaudeDeck.zip`, unzip, move to `/Applications`.

            ⚠️ The app is ad-hoc signed (not notarized). On first launch, remove the quarantine flag:
            ```bash
            xattr -dr com.apple.quarantine /Applications/ClaudeDeck.app
            ```
            (or right-click → Open). Requires macOS 13+.
